[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "translation"
version = "0.1.0"
description = "Word counter for language learning"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Samrawi Mehreteab" }
]
dependencies = [
    "openai-whisper>=20250625",
    "RapidFuzz>=3.14.5",
]

[project.urls]
Repository = "https://github.com/smsync17/Translation.git"